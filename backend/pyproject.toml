[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
[tool.ruff.format]
quote-style="double"
indent-style = "space"
